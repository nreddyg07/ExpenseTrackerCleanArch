<mat-card>

  <mat-card-header>
    <mat-card-title>Expenses</mat-card-title>

    <span style="flex:1"></span>

    <button mat-raised-button color="primary" (click)="create()">
      <mat-icon>add</mat-icon>
      New
    </button>
  </mat-card-header>

  <mat-card-content>

    <table mat-table [dataSource]="expenses">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let e">{{e.title}}</td>
      </ng-container>

      <ng-container matColumnDef="amt">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let e">{{e.amt}}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let e">{{e.category}}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let e">{{e.date | date}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let e">

          <button mat-button color="primary" (click)="edit(e)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-button color="warn" (click)="remove(e)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card-content>

</mat-card>
