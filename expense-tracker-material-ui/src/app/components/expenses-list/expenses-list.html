          <input matInput (keyup)="search($event)" placeholder="Search expenses">

        <button mat-raised-button color="warn" (click)="deleteSelected()">

          Delete Selected

        </button>

        <button mat-raised-button color="primary" (click)="create()">
          <mat-icon>add</mat-icon>
          New
        </button>
        <button mat-raised-button color="accent" (click)="saveAllChanges()" [disabled]="!hasUnsavedChanges">

          Save All Changes
        </button>
      </mat-card-header>

      <mat-card-content>

        <table mat-table [dataSource]="dataSource">

          <ng-container matColumnDef="select">

            <th mat-header-cell *matHeaderCellDef>

              <mat-checkbox (change)="toggleAllRows()" [checked]="isAllSelected()">
              </mat-checkbox>

            </th>

            <td mat-cell *matCellDef="let row">

              <mat-checkbox (click)="$event.stopPropagation()" (change)="selection.toggle(row)"
                [checked]="selection.isSelected(row)">
              </mat-checkbox>

            </td>

          </ng-container>

          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let e">
              <span [innerHTML]="highlight(e.title)"></span>
            </td>
          </ng-container>

          <ng-container matColumnDef="amt">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let e">{{e.amt}}</td>
          </ng-container>

          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef class="category-header">
              <span>Category</span>
              <button mat-icon-button [matMenuTriggerFor]="categoryMenu" class="category-filter-btn">
                <mat-icon>filter_list</mat-icon>
              </button>
              <mat-menu #categoryMenu="matMenu">
                <button mat-menu-item (click)="categoryFilter=''; applyFilter()">All</button>
                <button mat-menu-item *ngFor="let cat of categories" (click)="categoryFilter=cat; applyFilter()">
                  {{cat}}
                </button>
              </mat-menu>
            </th>
            <td mat-cell *matCellDef="let e">{{e.category}}</td>
          </ng-container>

          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let e">{{e.date | date}}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let e">

              <button mat-button color="primary" (click)="edit(e)">
                <mat-icon>edit</mat-icon>
              </button>

              <button mat-button color="warn" (click)="remove(e)">
                <mat-icon>delete</mat-icon>
              </button>

            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

      </mat-card-content>

    </mat-card>

  </mat-drawer-content>

  <mat-drawer position="end" mode="over" [opened]="isDrawerOpen" (closedStart)="closeDrawer()">

    <app-expense-form [expense]="selectedExpense" (saveExpense)="onFormSubmit($event)" (cancelEvent)="handleCancel()"
      (formDirty)="isFormDirty = $event">
    </app-expense-form>

  </mat-drawer>

</mat-drawer-container>
