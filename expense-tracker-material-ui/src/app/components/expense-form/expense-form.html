<div class="expense-form-container">

  <h2>{{ id ? 'Edit Expense' : 'New Expense' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Title -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title">

      <mat-error *ngIf="form.get('title')?.hasError('required')">
        Title is required
      </mat-error>
    </mat-form-field>


    <!-- Amount -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amt">

      <mat-error *ngIf="form.get('amt')?.hasError('required')">
        Amount is required
      </mat-error>

      <mat-error *ngIf="form.get('amt')?.hasError('min')">
        Amount must be greater than 0
      </mat-error>
    </mat-form-field>


    <!-- Category -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Category</mat-label>
      <input matInput type="text" formControlName="category">

      <mat-error *ngIf="form.get('category')?.hasError('required')">
        Category is required
      </mat-error>
    </mat-form-field>


    <!-- Date -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="date">

      <mat-error *ngIf="form.get('date')?.hasError('required')">
        Date is required
      </mat-error>
    </mat-form-field>


    <!-- Buttons -->
    <div class="button-group">

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid">

        {{ id ? 'Update' : 'Create' }}

      </button>

      <button
        mat-button
        type="button"
        (click)="cancel()">

        Cancel

      </button>

    </div>

  </form>

</div>
