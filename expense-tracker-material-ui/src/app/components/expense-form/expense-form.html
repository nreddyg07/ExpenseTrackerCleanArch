<div class="expense-form-container">

  <!-- 🔹 Header (Top bar with title + cancel button) -->
  <div class="form-header">
    <h2>{{ id ? 'Edit Expense' : 'New Expense' }}</h2>

    <button
      mat-icon-button
      type="button"
      (click)="cancelForm()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Title -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title">

      <mat-error *ngIf="form.get('title')?.hasError('required')">
        Title is required
      </mat-error>
    </mat-form-field>

    <!-- Amount -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amt">

      <mat-error *ngIf="form.get('amt')?.hasError('required')">
        Amount is required
      </mat-error>

      <mat-error *ngIf="form.get('amt')?.hasError('min')">
        Amount must be greater than 0
      </mat-error>
    </mat-form-field>

    <!-- Category -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
  <mat-label>Category</mat-label>

  <mat-select formControlName="category">
    <mat-option value="Food">Food</mat-option>
    <mat-option value="Travel">Travel</mat-option>
    <mat-option value="Shopping">Shopping</mat-option>
    <mat-option value="Bills">Bills</mat-option>
  </mat-select>

  <mat-error *ngIf="form.get('category')?.hasError('required')">
    Category is required
  </mat-error>
</mat-form-field>

    <!-- Date -->
    <mat-form-field appearance="outline" floatLabel="always" class="full-width">
  <mat-label>Date</mat-label>

  <input 
    matInput 
    [matDatepicker]="picker" 
    formControlName="date"
    readonly>

  <!-- Toggle button (calendar icon) -->
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>

  <!-- Datepicker panel -->
  <mat-datepicker #picker></mat-datepicker>

  <mat-error *ngIf="form.get('date')?.hasError('required')">
    Date is required
  </mat-error>
</mat-form-field>

    <!-- Buttons -->
    <div class="button-group">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || (isEditMode && !hasRealChanges())">

        {{ id ? 'Update' : 'Create' }}

      </button>
    </div>

  </form>

</div>
