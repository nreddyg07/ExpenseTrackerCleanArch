<section class="panel">
  <h2>{{ id ? 'Edit Expense' : 'New Expense' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Title</label>
      <input formControlName="title" />
      <div *ngIf="form.get('title')?.touched && form.get('title')?.invalid" class="error">
        Title is required.
      </div>
    </div>

    <div class="field">
      <label>Amount</label>
      <input type="number" formControlName="amt" step="0.01" />
      <div *ngIf="form.get('amt')?.touched && form.get('amt')?.invalid" class="error">
        Valid amount required (greater than 0).
      </div>
    </div>

    <div class="field">
      <label>Category</label>
      <input formControlName="category" />
    </div>

    <div class="field">
      <label>Date</label>
      <input type="date" formControlName="date" />
      <div *ngIf="form.get('date')?.touched && form.get('date')?.invalid" class="error">
        Date is required.
      </div>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div class="actions">
      <button class="btn primary" type="submit" [disabled]="loading">{{ id ? 'Update' : 'Create' }}</button>
      <button class="btn" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</section>
